# Reverse proxy for the production compose stack (docker-compose.prod.yml).
# One public origin: frontend at /, API under /api/* + /health.
# /metrics is deliberately NOT reachable from outside — Prometheus scrapes the
# backend container directly on the internal Docker network.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    server_tokens off;   # don't advertise nginx version

    # Compression for JSON/HTML/JS — NOT applied to SSE (see /api/chat below).
    gzip on;
    gzip_types application/json text/plain text/css application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Two-tier body-size guard. The app enforces the real limit — 64 KB, with a
    # structured JSON 413 (see RAG/security.py MAX_REQUEST_BYTES). This coarser
    # 128 KB nginx cap is a deliberate outer guard: bodies of 64–128 KB still
    # reach the backend and get the clean JSON 413; only grossly oversized
    # (>128 KB) bodies are dropped early here (with nginx's plain 413) to shield
    # the backend from obvious abuse. Keep this >= the app limit, not equal to it.
    client_max_body_size 128k;

    upstream backend {
        server backend:8000;
    }
    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;

        # TODO(deploy): add the TLS server block (listen 443 ssl; certs via
        # certbot/host platform) and a 80->443 redirect. HSTS headers are
        # already emitted by both apps and take effect once TLS is live.

        # ── Blocked from public access ─────────────────────────────────────
        location = /metrics {
            # Prometheus scrapes backend:8000/metrics on the internal network.
            return 404;
        }

        # ── API ────────────────────────────────────────────────────────────
        location = /health {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE streaming endpoint — buffering must be OFF or tokens arrive in
        # one burst at the end instead of streaming; long read timeout for
        # slow LLM generations.
        location = /api/chat {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_cache        off;
            gzip               off;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── Frontend (everything else) ─────────────────────────────────────
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            # Immutable fingerprinted assets — cache hard at the edge.
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
