name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: RAG/requirements.txt

      - name: Install dependencies (CPU torch — no GPU in CI)
        working-directory: RAG
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      # Live tests need a running server + Qdrant/LLM credentials — they run
      # locally and in staging, not here. Unit tests cover the registry,
      # session store, security policy, SQL scoping, and request schemas.
      - name: Run unit tests
        working-directory: RAG
        run: pytest -m "not live" -v

  frontend-build:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # eslint has pre-existing findings in lib/i18n.tsx & lib/theme.tsx
      # (tracked in PROJECT_SPEC.md technical debt) — report, don't block.
      - name: Lint (advisory)
        run: npx eslint .
        continue-on-error: true

  security-scans:
    name: Dependency audits (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r RAG/requirements.txt
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-builds:
    name: Docker image builds
    # Heavy (torch download) — main branch only; PRs get test/build feedback above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: RAG
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
